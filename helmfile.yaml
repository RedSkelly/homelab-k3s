# Helmfile: bootstrap and break-glass Helm release management.
#
# Argo CD is the reconciler for day-to-day operations. Helmfile covers initial
# cluster standup (before Argo CD exists), manual sync if Argo CD is down, and
# testing value changes before they are committed.
#
# Values files live alongside their component in kubernetes/<layer>/<component>/values.yaml
# and are the single source of truth for whichever reconciler owns the component:
# Helmfile references them directly (below); a component migrated to Argo CD references
# the same file by path from its Application (e.g. ingress-nginx). cert-manager is the
# exception: its values are chart defaults, inlined in its Application, so it has no
# values.yaml.

---
helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true
  historyMax: 5

repositories:
  - name: jetstack
    url: https://charts.jetstack.io
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  # --- core ---
  # cert-manager: migrated to Argo CD management (2026-04-29).
  # Application manifest: kubernetes/bootstrap/argocd/applications/cert-manager.yaml
  #
  # ingress-nginx: migrated to Argo CD management (2026-07-25).
  # Application manifest: kubernetes/bootstrap/argocd/applications/ingress-nginx.yaml

  # --- monitoring ---
  # kps (kube-prometheus-stack): migrated to Argo CD management (2026-07-26).
  # Application manifest: kubernetes/bootstrap/argocd/applications/kps.yaml
  # (values.yaml + SOPS secrets.values.yaml consumed via helm-secrets wrapper mode)

  # --- bootstrap ---
  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 9.5.9
    values:
      - kubernetes/bootstrap/argocd/values.yaml
