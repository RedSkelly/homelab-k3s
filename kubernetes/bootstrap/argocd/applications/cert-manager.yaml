# Argo CD Application: cert-manager
#
# Migrated from Helmfile (2026-04-29), pinned to the chart version Helmfile
# deployed. Values are chart defaults, so they are inlined rather than kept in a
# values.yaml.
#
# syncPolicy is manual (no automated sync/prune/selfHeal): every reconcile is
# human-triggered.
#
# ServerSideApply avoids the client-side apply annotation size limit, which
# cert-manager's CRDs exceed.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.19.2
    helm:
      valuesObject:
        crds:
          enabled: true
        replicaCount: 1
        webhook:
          replicaCount: 1
        cainjector:
          replicaCount: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
