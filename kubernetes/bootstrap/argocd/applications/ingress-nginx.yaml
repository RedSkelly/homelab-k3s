# Argo CD Application: ingress-nginx
#
# Migrated from Helmfile (2026-07-25), pinned to the chart version Helmfile
# deployed (chart 4.14.1 / app v1.14.1).
#
# Multi-source, so the in-repo values.yaml stays the single source of truth: the
# upstream chart, plus this repo exposed as the `$values` ref that valueFiles
# resolves against. The Git source clones anonymously and has no repository
# secret, so this ref breaks if the repo is made private.
#
# syncPolicy is manual (no automated sync/prune/selfHeal): every reconcile is
# human-triggered.
#
# ServerSideApply avoids the client-side apply annotation size limit.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Upstream chart, pinned to the version Helmfile currently deploys.
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.14.1
      helm:
        valueFiles:
          # Resolved from the `$values` ref source below (repo root).
          - $values/kubernetes/core/ingress-nginx/values.yaml
    # This Git repo, referenced only to supply the values file above.
    # `ref` sources render nothing themselves; they just expose the tree.
    - repoURL: https://github.com/RedSkelly/homelab-k3s.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
