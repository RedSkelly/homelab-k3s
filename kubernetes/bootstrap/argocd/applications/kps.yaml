# Argo CD Application -- kube-prometheus-stack (kps)
#
# Final Helmfile-to-Argo CD migration (after cert-manager and ingress-nginx).
# Mirrors the ingress-nginx multi-source pattern: the upstream chart plus this
# Git repo exposed as the `$values` ref, so the hand-authored values file is
# referenced BY PATH (single source of truth), not inlined.
#
# kps-specific details:
#
#   releaseName: kps -- CRITICAL. Every rendered resource name derives from the
#     Helm release name (kps-grafana, prometheus-kps-kube-prometheus-stack-*,
#     etc.). The existing release is named `kps`, so this is pinned explicitly:
#     a mismatch would make Argo CD create a parallel set of resources instead
#     of adopting the running ones. (It also matches the Application name, but
#     pinning removes all ambiguity.)
#
#   Encrypted overlay (NO secrets:// prefix -- deliberate) -- the Alertmanager
#     Slack webhook lives in the SOPS/age-encrypted secrets.values.yaml (overlays
#     alertmanager.config.global.slack_api_url). helm-secrets does NOT support the
#     secrets:// scheme in an Argo CD multi-source app: Argo only expands the
#     $values ref when it is the FIRST token of the path, which a secrets://
#     prefix breaks (the ref resolves to empty -> "File does not exist"). The
#     supported path is helm-secrets WRAPPER MODE: the repo-server sets
#     HELM_SECRETS_WRAPPER_ENABLED=true and HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH=true
#     (plus HELM_SECRETS_BACKEND=sops and SOPS_AGE_KEY_FILE mounted from the
#     sops-age secret), so the wrapper transparently decrypts any SOPS file passed
#     as a plain --values. The plaintext webhook never touches Git or disk.
#     Listed AFTER values.yaml so the overlay wins, matching the old Helmfile
#     values:/secrets: ordering. Do NOT re-add secrets:// here -- it re-breaks
#     manifest generation. (Ref: helm-secrets wiki, ArgoCD-Integration.)
#
#   ServerSideApply=true -- MANDATORY. kps ships large CRDs (Prometheus,
#     Alertmanager, ServiceMonitor, PodMonitor, PrometheusRule, ...); SSA merges
#     field ownership with Helm's instead of hitting the client-side annotation
#     size limit or fighting over CRD ownership.
#
# syncPolicy is manual (no automated sync/prune/selfHeal), mirroring the prior
# two migrations, so the first reconcile and every later change is human-driven.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Upstream chart, pinned to the version Helmfile currently deploys.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 81.0.0
      helm:
        releaseName: kps
        valueFiles:
          # Resolved from the `$values` ref source below (repo root).
          - $values/kubernetes/monitoring/kube-prometheus-stack/values.yaml
          # SOPS/age-encrypted overlay. No secrets:// prefix on purpose: the
          # $values ref must be the first token, so decryption happens via
          # helm-secrets wrapper mode on the repo-server (see header comment).
          - $values/kubernetes/monitoring/kube-prometheus-stack/secrets.values.yaml
    # This Git repo, referenced only to supply the values files above.
    # `ref` sources render nothing themselves; they just expose the tree.
    - repoURL: https://github.com/RedSkelly/homelab-k3s.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
