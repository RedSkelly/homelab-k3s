# Argo CD Application: kube-prometheus-stack (kps)
#
# Migrated from Helmfile (2026-07-26). Same multi-source pattern as
# ingress-nginx: the upstream chart plus this repo exposed as the `$values` ref.
#
# Three settings that must not be changed without reading why first:
#
#   releaseName: kps
#     Every rendered resource name derives from the Helm release name
#     (kps-grafana, prometheus-kps-kube-prometheus-stack-*). The running release
#     is named `kps`; a mismatch makes Argo CD create a parallel set of resources
#     instead of adopting the running ones.
#
#   No secrets:// prefix on the encrypted overlay
#     Argo only expands the $values ref when it is the first token of the path,
#     so a secrets:// prefix resolves the ref to empty ("File does not exist").
#     Decryption happens instead via helm-secrets wrapper mode on the repo-server
#     (HELM_SECRETS_WRAPPER_ENABLED, see bootstrap/argocd/values.yaml), which
#     decrypts any SOPS file passed as a plain --values. Re-adding secrets:// here
#     breaks manifest generation. Ref: helm-secrets wiki, ArgoCD-Integration.
#
#   ServerSideApply=true
#     kps ships large CRDs (Prometheus, Alertmanager, ServiceMonitor, PodMonitor,
#     PrometheusRule). SSA merges field ownership with Helm's instead of hitting
#     the client-side annotation size limit or contending over CRD ownership.
#
# syncPolicy is manual (no automated sync/prune/selfHeal): every reconcile is
# human-triggered.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Upstream chart, pinned to the version Helmfile currently deploys.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 81.0.0
      helm:
        releaseName: kps
        valueFiles:
          # Resolved from the `$values` ref source below (repo root).
          - $values/kubernetes/monitoring/kube-prometheus-stack/values.yaml
          # SOPS/age-encrypted overlay, listed after values.yaml so it wins.
          # No secrets:// prefix: see the header.
          - $values/kubernetes/monitoring/kube-prometheus-stack/secrets.values.yaml
    # This Git repo, referenced only to supply the values files above.
    # `ref` sources render nothing themselves; they just expose the tree.
    - repoURL: https://github.com/RedSkelly/homelab-k3s.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
